<!doctype html><meta charset="utf-8"><title>ROS diagram review</title><style>body{margin:8px;background:#071c17;color:#f1f8f4;font:14px system-ui}a{color:#8fd7b5;margin-right:18px}iframe{border:0;height:1150px}main{display:flex;gap:24px}aside{width:700px}img{width:100%;background:#f1f8f4}</style><nav><a href="?kind=0">Manager</a><a href="?kind=1">Speech</a><a href="?kind=2">Vision</a><a href="?kind=3">Arm</a><a href="?kind=0&width=320">Mobile manager</a><a href="?kind=1&width=320">Mobile speech</a><a href="?kind=2&width=320">Mobile vision</a><a href="?kind=3&width=320">Mobile arm</a><a href="?test=1">Layout checks</a></nav><pre id="results"></pre><main id="frames"></main><script>
(async()=>{let q=new URLSearchParams(location.search),out=document.querySelector('#frames');if(q.has('test')){let checks=[];for(let width of [1440,1024,768,390,320]){let f=document.createElement('iframe');f.style.width=width+'px';f.src='cobot.html';out.append(f);await new Promise(r=>f.onload=r);let d=f.contentDocument;d.querySelector('#ros2-service-diagrams').open=true;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let svg=[...d.querySelectorAll('.ros-flow')].filter(s=>getComputedStyle(s).display!='none'),issues=[];for(let s of svg){let vb=s.viewBox.baseVal;for(let r of s.querySelectorAll('.ros-process')){let rb=r.getBBox(),tb=r.nextElementSibling.getBBox();if(tb.x<rb.x+1||tb.x+tb.width>rb.x+rb.width-1||tb.y<rb.y||tb.y+tb.height>rb.y+rb.height)issues.push('Node text: '+r.nextElementSibling.textContent)}for(let t of s.querySelectorAll('text')){let b=t.getBBox();if(b.x<0||b.x+b.width>vb.width||b.y<0||b.y+b.height>vb.height)issues.push(s.getAttribute('aria-labelledby')+': '+t.textContent)}}checks.push([width,d.documentElement.scrollWidth<=width+1,svg.length,issues]);f.remove()}document.querySelector('#results').textContent=JSON.stringify(checks);return}let f=document.createElement('iframe');f.style.width=(q.get('width')||1440)+'px';f.src='cobot.html';out.append(f);await new Promise(r=>f.onload=r);let d=f.contentDocument;d.querySelector('#ros2-service-diagrams').open=true;await Promise.allSettled([...d.images].map(i=>{i.loading='eager';return i.decode()}));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let kind=+(q.get('kind')||0);f.contentWindow.scrollTo({top:d.querySelectorAll('.ros-figure')[kind].getBoundingClientRect().top+f.contentWindow.scrollY-100,behavior:'instant'});let aside=document.createElement('aside');aside.innerHTML='<p>Original source diagram</p><img src="assets/projects/voice-cobot/voice-controlled-cobot-ros2-'+['manager-client','speech-service','vision-service','arm-service'][kind]+'-diagram.svg">';out.append(aside)})();
</script>
