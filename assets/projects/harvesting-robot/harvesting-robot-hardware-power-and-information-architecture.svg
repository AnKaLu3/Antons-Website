<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1040" width="1100" height="1040" role="img" aria-labelledby="title desc"><title id="title">Hardware, information and power architecture</title><desc id="desc">Signal flow is grouped into Perception, Control and Actuation. Separate Power lanes preserve every supplier: battery to Sabertooth and converter; Sabertooth to motors; converter to Pi and Arduino; Pi to camera; Arduino to servo shield, encoders and fans; shield to arm. All original image, serial, PWM and digital feedback relationships are retained.</desc><style>text{fill:#071c17;font:18px system-ui,sans-serif;text-anchor:middle} .small{font-size:16px;fill:#284d3c} .group{font-size:16px;fill:#284d3c;letter-spacing:.08em} .node{fill:#c9d9cc;stroke:#527363;stroke-width:.8} .edge{fill:none;stroke:#071c17;stroke-width:1;marker-end:url(#arrow)} .sense{stroke:#285f4c} .p12{stroke:#3e574b;stroke-dasharray:5 3} .p5{stroke:#285f4c;stroke-dasharray:1 3}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs><rect width="1100" height="1040" fill="#b8cbbd"/><text x="145" y="40" class="group">PERCEPTION</text><text x="445" y="40" class="group">CONTROL</text><text x="850" y="40" class="group">ACTUATION</text><rect class="node" x="35.0" y="79.0" width="220" height="66" rx="3"/><text x="145" y="107.0" class="">Camera Module 3</text><text x="145" y="129.0" class="small">v3 Wide</text><rect class="node" x="35.0" y="239.0" width="220" height="66" rx="3"/><text x="145" y="267.0" class="">Raspberry Pi 5</text><text x="145" y="289.0" class="small">image processing</text><rect class="node" x="330.0" y="248.0" width="230" height="48" rx="3"/><text x="445" y="278.0" class="">Arduino Mega 2560</text><rect class="node" x="560.0" y="79.0" width="180" height="66" rx="3"/><text x="650" y="107.0" class="">Sabertooth</text><text x="650" y="129.0" class="small">motor controller</text><rect class="node" x="560.0" y="408.0" width="180" height="48" rx="3"/><text x="650" y="438.0" class="">Servo shield</text><rect class="node" x="840.0" y="79.0" width="220" height="66" rx="3"/><text x="950" y="107.0" class="">Drive motors</text><text x="950" y="129.0" class="small">four wheels</text><rect class="node" x="840.0" y="239.0" width="220" height="66" rx="3"/><text x="950" y="267.0" class="">Wheel encoders</text><text x="950" y="289.0" class="small">front left + right</text><rect class="node" x="840.0" y="399.0" width="220" height="66" rx="3"/><text x="950" y="427.0" class="">Grab-it arm</text><text x="950" y="449.0" class="small">six servo motors</text><rect class="node" x="560.0" y="517.0" width="180" height="66" rx="3"/><text x="650" y="545.0" class="">DC fans</text><text x="650" y="567.0" class="small">four · 5 V</text><path class="edge " d="M145 145 V239"/><text x="190" y="197" class="small">Images</text><path class="edge " d="M255 272 H330"/><text x="293" y="229" class="small">Object data · serial</text><path class="edge " d="M445 248 V112 H560"/><text x="500" y="92" class="small">Serial</text><path class="edge " d="M740 112 H840"/><text x="790" y="92" class="small">PWM</text><path class="edge " d="M840 272 H560"/><text x="703" y="251" class="small">Rotation · digital</text><path class="edge " d="M445 296 V432 H560"/><text x="505" y="410" class="small">Servo control</text><path class="edge " d="M740 432 H840"/><text x="790" y="410" class="small">Angles · PWM</text><path class="edge " d="M445 432 V550 H560"/><text x="488" y="577" class="small">Fan PWM</text><text x="145" y="641" class="group">POWER</text><rect class="node" x="120.0" y="667.0" width="310" height="66" rx="3"/><text x="275" y="695.0" class="">Battery · 4000 mAh</text><text x="275" y="717.0" class="small">12 V · warning 11.4 V</text><rect class="node" x="635.0" y="676.0" width="350" height="48" rx="3"/><text x="810" y="706.0" class="">Sabertooth → motors</text><path class="edge p12" d="M430 700 H635"/><text x="533" y="686" class="small">12 V</text><rect class="node" x="120.0" y="771.0" width="310" height="48" rx="3"/><text x="275" y="801.0" class="">12 V → 5 V converter</text><rect class="node" x="635.0" y="771.0" width="350" height="48" rx="3"/><text x="810" y="801.0" class="">Pi 5 → camera</text><path class="edge p5" d="M430 795 H635"/><text x="533" y="781" class="small">5 V</text><rect class="node" x="120.0" y="866.0" width="310" height="48" rx="3"/><text x="275" y="896.0" class="">Arduino Mega 2560</text><rect class="node" x="635.0" y="866.0" width="350" height="48" rx="3"/><text x="810" y="896.0" class="">Servo shield → arm</text><path class="edge p5" d="M430 890 H635"/><text x="533" y="876" class="small">5 V</text><rect class="node" x="120.0" y="961.0" width="310" height="48" rx="3"/><text x="275" y="991.0" class="">Arduino Mega 2560</text><rect class="node" x="635.0" y="961.0" width="350" height="48" rx="3"/><text x="810" y="991.0" class="">Encoders + fans</text><path class="edge p5" d="M430 985 H635"/><text x="533" y="971" class="small">5 V</text><path class="edge p12" d="M120 700 H75 V795 H120"/><text x="46" y="753" class="small">12 V</text><path class="edge p5" d="M430 795 H490 V890 H430"/><text x="523" y="855" class="small">5 V</text><path class="edge p5" d="M275 914 V961"/></svg>