<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Harvesting robot — hardware, information and power architecture</title><desc id="desc">Camera images go to Raspberry Pi 5, object information over serial to Arduino Mega, drive requests over serial to Sabertooth, and PWM to drive motors and arm servos. Wheel encoders return digital measured rotation. The 4000 mAh battery provides 12 V to converter and Sabertooth, which powers drive motors. The converter supplies 5 V to Pi and Arduino/servo shield; Pi supplies the camera; Arduino/servo shield supplies encoders, arm and fans. Arduino PWM controls fan speed. A LiPo warning is set at 11.4 V.</desc><style>svg{--ink:#071c17;--paper:#f1f8f4;--sage:#b8cbbd;--green:#285f4c;--edge:#4f9275;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:600;letter-spacing:.06em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:5 5}.link{fill:none;stroke:var(--ink);stroke-width:3}.reach{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:var(--ink);stroke-width:1.2}.joint{fill:var(--paper);stroke:var(--ink);stroke-width:2}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="1200" height="780" fill="#b8cbbd"/><text x="65" y="38" class="heading" text-anchor="start">PERCEPTION</text><text x="405" y="38" class="heading" text-anchor="start">CONTROL</text><text x="930" y="38" class="heading" text-anchor="start">ACTUATION</text><g><rect x="62.5" y="114.0" width="205" height="72" rx="2" class="component"/><circle cx="84.5" cy="150" r="11" class="illustration"/><circle cx="84.5" cy="150" r="4" class="illustration"/><text x="177" y="144" class="node-title" text-anchor="middle">Camera Module 3</text><text x="177" y="168" class="small" text-anchor="middle">v3 Wide · ribbon cable</text></g><g><rect x="62.5" y="284.0" width="205" height="82" rx="2" class="component"/><path d="M78.5 284.0 v-7 M78.5 366.0 v7" class="pin"/><path d="M90.5 284.0 v-7 M90.5 366.0 v7" class="pin"/><path d="M239.5 284.0 v-7 M239.5 366.0 v7" class="pin"/><path d="M251.5 284.0 v-7 M251.5 366.0 v7" class="pin"/><text x="165" y="319" class="node-title" text-anchor="middle">Raspberry Pi 5</text><text x="165" y="343" class="small" text-anchor="middle">image processing</text></g><g><rect x="425.0" y="108.0" width="230" height="84" rx="2" class="component"/><path d="M441.0 108.0 v-7 M441.0 192.0 v7" class="pin"/><path d="M453.0 108.0 v-7 M453.0 192.0 v7" class="pin"/><path d="M627.0 108.0 v-7 M627.0 192.0 v7" class="pin"/><path d="M639.0 108.0 v-7 M639.0 192.0 v7" class="pin"/><text x="540" y="144" class="node-title" text-anchor="middle">Sabertooth</text><text x="540" y="168" class="small" text-anchor="middle">motor controller</text></g><g><rect x="425.0" y="281.0" width="230" height="88" rx="2" class="component"/><path d="M441.0 281.0 v-7 M441.0 369.0 v7" class="pin"/><path d="M453.0 281.0 v-7 M453.0 369.0 v7" class="pin"/><path d="M627.0 281.0 v-7 M627.0 369.0 v7" class="pin"/><path d="M639.0 281.0 v-7 M639.0 369.0 v7" class="pin"/><text x="540" y="331" class="node-title" text-anchor="middle">Arduino Mega 2560</text></g><g><rect x="425.0" y="432.0" width="230" height="76" rx="2" class="component"/><path d="M441.0 432.0 v-7 M441.0 508.0 v7" class="pin"/><path d="M453.0 432.0 v-7 M453.0 508.0 v7" class="pin"/><path d="M627.0 432.0 v-7 M627.0 508.0 v7" class="pin"/><path d="M639.0 432.0 v-7 M639.0 508.0 v7" class="pin"/><text x="540" y="476" class="node-title" text-anchor="middle">Servo shield</text></g><g><rect x="905.0" y="108.0" width="230" height="84" rx="2" class="component"/><path d="M921.0 108.0 v-7 M921.0 192.0 v7" class="pin"/><path d="M933.0 108.0 v-7 M933.0 192.0 v7" class="pin"/><path d="M1107.0 108.0 v-7 M1107.0 192.0 v7" class="pin"/><path d="M1119.0 108.0 v-7 M1119.0 192.0 v7" class="pin"/><text x="1020" y="144" class="node-title" text-anchor="middle">Drive motors</text><text x="1020" y="168" class="small" text-anchor="middle">four rover wheels</text></g><g><rect x="905.0" y="283.0" width="230" height="84" rx="2" class="component"/><path d="M921.0 283.0 v-7 M921.0 367.0 v7" class="pin"/><path d="M933.0 283.0 v-7 M933.0 367.0 v7" class="pin"/><path d="M1107.0 283.0 v-7 M1107.0 367.0 v7" class="pin"/><path d="M1119.0 283.0 v-7 M1119.0 367.0 v7" class="pin"/><text x="1020" y="319" class="node-title" text-anchor="middle">Wheel encoders</text><text x="1020" y="343" class="small" text-anchor="middle">front left + right</text></g><g><rect x="905.0" y="428.0" width="230" height="84" rx="2" class="component"/><path d="M921.0 428.0 v-7 M921.0 512.0 v7" class="pin"/><path d="M933.0 428.0 v-7 M933.0 512.0 v7" class="pin"/><path d="M1107.0 428.0 v-7 M1107.0 512.0 v7" class="pin"/><path d="M1119.0 428.0 v-7 M1119.0 512.0 v7" class="pin"/><text x="1020" y="464" class="node-title" text-anchor="middle">Grab-it arm</text><text x="1020" y="488" class="small" text-anchor="middle">six servo motors</text></g><g><rect x="905.0" y="608.0" width="230" height="84" rx="2" class="component"/><path d="M921.0 608.0 v-7 M921.0 692.0 v7" class="pin"/><path d="M933.0 608.0 v-7 M933.0 692.0 v7" class="pin"/><path d="M1107.0 608.0 v-7 M1107.0 692.0 v7" class="pin"/><path d="M1119.0 608.0 v-7 M1119.0 692.0 v7" class="pin"/><text x="1020" y="644" class="node-title" text-anchor="middle">DC fans</text><text x="1020" y="668" class="small" text-anchor="middle">5 V · four fans</text></g><g><rect x="62.5" y="608.0" width="205" height="84" rx="2" class="component"/><path d="M78.5 608.0 v-7 M78.5 692.0 v7" class="pin"/><path d="M90.5 608.0 v-7 M90.5 692.0 v7" class="pin"/><path d="M239.5 608.0 v-7 M239.5 692.0 v7" class="pin"/><path d="M251.5 608.0 v-7 M251.5 692.0 v7" class="pin"/><text x="165" y="644" class="node-title" text-anchor="middle">Battery · 4000 mAh</text><text x="165" y="668" class="small" text-anchor="middle">LiPo warning: 11.4 V</text></g><g><rect x="425.0" y="608.0" width="230" height="84" rx="2" class="component"/><path d="M441.0 608.0 v-7 M441.0 692.0 v7" class="pin"/><path d="M453.0 608.0 v-7 M453.0 692.0 v7" class="pin"/><path d="M627.0 608.0 v-7 M627.0 692.0 v7" class="pin"/><path d="M639.0 608.0 v-7 M639.0 692.0 v7" class="pin"/><text x="540" y="644" class="node-title" text-anchor="middle">Voltage converter</text><text x="540" y="668" class="small" text-anchor="middle">12 V → 5 V</text></g><path d="M145 186 V284" class="signal"/><text x="77" y="236" class="small" text-anchor="middle">Image data</text><path d="M267 320 H425" class="signal"/><text x="347" y="302" class="small" text-anchor="middle">Object data · serial</text><path d="M520 281 V192" class="signal"/><text x="591" y="248" class="small" text-anchor="middle">Drive · serial</text><path d="M655 135 H905" class="signal"/><text x="779" y="119" class="small" text-anchor="middle">Motor speed / direction · PWM</text><path d="M905 313 H655" class="signal"/><text x="780" y="293" class="small" text-anchor="middle">Measured rotation · digital</text><path d="M540 369 V432" class="signal"/><text x="631" y="410" class="small" text-anchor="middle">Servo control</text><path d="M655 455 H905" class="signal"/><text x="780" y="438" class="small" text-anchor="middle">Servo angles · PWM</text><path d="M655 349 H756 V447 Q766 455 756 463 V477 Q766 485 756 493 