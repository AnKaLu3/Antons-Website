<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2080" width="360" height="2080" role="img" aria-labelledby="title desc"><title id="title">Hardware, information and power architecture</title><desc id="desc">All hardware control and power relationships retained; compact supply paths sit below the signal flow.</desc><style>text{fill:#071c17;font:18px system-ui,sans-serif;text-anchor:middle} .small{font-size:16px;fill:#284d3c} .group{font-size:16px;fill:#284d3c;letter-spacing:.08em} .node{fill:#c9d9cc;stroke:#527363;stroke-width:.8} .edge{fill:none;stroke:#071c17;stroke-width:1;marker-end:url(#arrow)} .sense{stroke:#285f4c} .p12{stroke:#3e574b;stroke-dasharray:5 3} .p5{stroke:#285f4c;stroke-dasharray:1 3}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs><rect width="360" height="2080" fill="#b8cbbd"/><text x="180" y="32" class="group">PERCEPTION</text><rect class="node" x="55.0" y="67.0" width="250" height="66" rx="3"/><text x="180" y="95.0" class="">Camera Module 3</text><text x="180" y="117.0" class="small">v3 Wide</text><rect class="node" x="55.0" y="187.0" width="250" height="66" rx="3"/><text x="180" y="215.0" class="">Raspberry Pi 5</text><text x="180" y="237.0" class="small">image processing</text><rect class="node" x="55.0" y="356.0" width="250" height="48" rx="3"/><text x="180" y="386.0" class="">Arduino Mega 2560</text><path class="edge " d="M180 133 V187"/><text x="224" y="166" class="small">Images</text><path class="edge " d="M180 253 V356"/><text x="180" y="309" class="small">Object data · serial</text><text x="180" y="350" class="group">CONTROL</text><rect class="node" x="55.0" y="502.0" width="250" height="66" rx="3"/><text x="180" y="530.0" class="">Sabertooth</text><text x="180" y="552.0" class="small">motor controller</text><rect class="node" x="55.0" y="622.0" width="250" height="66" rx="3"/><text x="180" y="650.0" class="">Drive motors</text><text x="180" y="672.0" class="small">four wheels</text><rect class="node" x="55.0" y="772.0" width="250" height="66" rx="3"/><text x="180" y="800.0" class="">Wheel encoders</text><text x="180" y="822.0" class="small">front left + right</text><rect class="node" x="55.0" y="931.0" width="250" height="48" rx="3"/><text x="180" y="961.0" class="">Servo shield</text><rect class="node" x="55.0" y="1042.0" width="250" height="66" rx="3"/><text x="180" y="1070.0" class="">Grab-it arm</text><text x="180" y="1092.0" class="small">six servo motors</text><rect class="node" x="55.0" y="1192.0" width="250" height="66" rx="3"/><text x="180" y="1220.0" class="">DC fans</text><text x="180" y="1242.0" class="small">four · 5 V</text><text x="180" y="464" class="group">ACTUATION</text><path class="edge " d="M180 404 V502"/><text x="220" y="488" class="small">Serial</text><path class="edge " d="M180 568 V622"/><text x="219" y="600" class="small">PWM</text><path class="edge " d="M305 805 H334 V380 H305"/><text x="305" y="747" class="small">Digital</text><path class="edge " d="M55 380 H25 V955 H55"/><text x="59" y="906" class="small">Servos</text><path class="edge " d="M180 979 V1042"/><text x="220" y="1018" class="small">PWM</text><path class="edge " d="M25 955 V1225 H55"/><text x="72" y="1164" class="small">Fan PWM</text><text x="180" y="1320" class="group">POWER</text><text x="180" y="1390" class="group">12 V</text><text x="180" y="1419" class="small">Battery → Sabertooth → motors</text><text x="180" y="1480" class="group">12 V</text><text x="180" y="1509" class="small">Battery → converter</text><text x="180" y="1570" class="group">5 V</text><text x="180" y="1599" class="small">Converter → Raspberry Pi 5</text><text x="180" y="1660" class="group">5 V</text><text x="180" y="1689" class="small">Pi 5 → camera</text><text x="180" y="1750" class="group">5 V</text><text x="180" y="1779" class="small">Converter → Arduino Mega</text><text x="180" y="1840" class="group">5 V</text><text x="180" y="1869" class="small">Arduino → servo shield → arm</text><text x="180" y="1930" class="group">5 V</text><text x="180" y="1959" class="small">Arduino → encoders + fans</text><text x="180" y="2045" class="small">Battery: 4000 mAh · warning: 11.4 V</text></svg>