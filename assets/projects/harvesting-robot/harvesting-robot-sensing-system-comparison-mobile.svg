<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1090" viewBox="0 0 320 1090" role="img" aria-labelledby="title desc"><title id="title">Two sensing systems on one robot platform — mobile schematic</title><desc id="desc">The camera and servo-swept ToF sensor converge on one Arduino and the same rover; sensor sweep control, encoder feedback and optical target inputs are retained.</desc><style>svg{--ink:#071c17;--paper:#f1f8f4;--sage:#b8cbbd;--green:#285f4c;--edge:#4f9275;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:600;letter-spacing:.06em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:5 5}.link{fill:none;stroke:var(--ink);stroke-width:3}.reach{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:var(--ink);stroke-width:1.2}.joint{fill:var(--paper);stroke:var(--ink);stroke-width:2}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="320" height="1090" fill="#b8cbbd"/><text x="20" y="32" class="heading" text-anchor="start">ALTERNATIVE INPUTS</text><g><rect x="65.0" y="63.0" width="190" height="64" rx="2" class="component"/><circle cx="87.0" cy="95" r="11" class="illustration"/><circle cx="87.0" cy="95" r="4" class="illustration"/><text x="172" y="89" class="node-title" text-anchor="middle">Camera Module 3</text><text x="172" y="113" class="small" text-anchor="middle">v3 Wide</text></g><g><rect x="65.0" y="193.0" width="190" height="64" rx="2" class="component"/><path d="M81.0 193.0 v-7 M81.0 257.0 v7" class="pin"/><path d="M93.0 193.0 v-7 M93.0 257.0 v7" class="pin"/><path d="M227.0 193.0 v-7 M227.0 257.0 v7" class="pin"/><path d="M239.0 193.0 v-7 M239.0 257.0 v7" class="pin"/><text x="160" y="219" class="node-title" text-anchor="middle">Raspberry Pi 5</text><text x="160" y="243" class="small" text-anchor="middle">Python · YOLOv8n</text></g><path d="M160 127 V193" class="signal"/><text x="230" y="168" class="small" text-anchor="middle">Image data</text><path d="M255 225 H294 V543 H255" class="signal"/><text x="275" y="325" class="small" text-anchor="middle">Target</text><text x="275" y="347" class="small" text-anchor="middle">data</text><text x="275" y="369" class="small" text-anchor="middle">serial</text><circle cx="35" cy="339" r="12" class="target"/><text x="35" y="370" class="small" text-anchor="middle">Ball</text><path d="M35 327 V95 H65" class="optical"/><g><rect x="65.0" y="382.0" width="190" height="64" rx="2" class="component"/><path d="M81.0 382.0 v-7 M81.0 446.0 v7" class="pin"/><path d="M93.0 382.0 v-7 M93.0 446.0 v7" class="pin"/><path d="M227.0 382.0 v-7 M227.0 446.0 v7" class="pin"/><path d="M239.0 382.0 v-7 M239.0 446.0 v7" class="pin"/><text x="160" y="408" class="node-title" text-anchor="middle">VL53L1X</text><text x="160" y="432" class="small" text-anchor="middle">servo-swept sensor</text></g><path d="M48 339 H160 V382" class="optical"/><text x="169" y="365" class="small" text-anchor="middle">Reflected light</text><g><rect x="65.0" y="533.0" width="190" height=