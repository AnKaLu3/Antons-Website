<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 944" width="360" height="944" role="img" aria-labelledby="title desc"><title id="title">Two sensing systems on one shared platform</title><desc id="desc">Identical sensing and feedback relationships arranged vertically for phones.</desc><style>text{fill:#071c17;font:18px system-ui,sans-serif;text-anchor:middle} .small{font-size:16px;fill:#284d3c} .group{font-size:16px;fill:#284d3c;letter-spacing:.08em} .node{fill:#c9d9cc;stroke:#527363;stroke-width:.8} .edge{fill:none;stroke:#071c17;stroke-width:1;marker-end:url(#arrow)} .sense{stroke:#285f4c} .p12{stroke:#3e574b;stroke-dasharray:5 3} .p5{stroke:#285f4c;stroke-dasharray:1 3}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs><rect width="360" height="944" fill="#b8cbbd"/><text x="180" y="32" class="group">TWO SENSING METHODS</text><rect class="node" x="35.0" y="59.0" width="290" height="48" rx="3"/><text x="180" y="89.0" class="">9 cm target ball</text><rect class="node" x="65.0" y="157.0" width="230" height="66" rx="3"/><text x="180" y="185.0" class="">Camera Module 3</text><text x="180" y="207.0" class="small">v3 Wide</text><path class="edge " d="M180 107 V157"/><text x="222" y="140" class="small">Image</text><rect class="node" x="65.0" y="277.0" width="230" height="66" rx="3"/><text x="180" y="305.0" class="">Raspberry Pi 5</text><text x="180" y="327.0" class="small">Python · YOLOv8n</text><path class="edge " d="M180 223 V277"/><text x="222" y="255" class="small">Images</text><rect class="node" x="65.0" y="422.0" width="230" height="66" rx="3"/><text x="180" y="450.0" class="">VL53L1X</text><text x="180" y="472.0" class="small">servo-swept sensor</text><path class="edge sense" d="M325 83 H329 V455 H295"/><text x="311" y="412" class="small">Light</text><rect class="node" x="65.0" y="617.0" width="230" height="66" rx="3"/><text x="180"