<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1300 360 780" width="360" height="780" role="img" aria-labelledby="title desc"><title id="title">Power distribution</title><desc id="desc">Battery and 12 V motor supply; 12 V to 5 V conversion; downstream Pi, camera, Arduino, servo shield, arm, encoder and fan supplies. Battery capacity 4000 mAh; warning threshold 11.4 V.</desc><style>text{fill:#071c17;font:18px system-ui,sans-serif;text-anchor:middle} .small{font-size:16px;fill:#284d3c} .group{font-size:16px;fill:#284d3c;letter-spacing:.08em} .node{fill:#c9d9cc;stroke:#527363;stroke-width:.8} .edge{fill:none;stroke:#071c17;stroke-width:1;marker-end:url(#arrow)} .sense{stroke:#8d3f23} .p12{stroke:#8d3f23;stroke-dasharray:5 3} .p5{stroke:#6b5700;stroke-dasharray:1 3}.pictogram{fill:none;stroke:#173c30;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arrow" viewBox="0 1300 360 780" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs><rect x="0" y="1300" width="360" height="780" fill="#b8cbbd"/><text x="180" y="1320" class="group">POWER</text><text x="180" y="1390" class="group">12 V</text><text x="180" y="1419" class="small">Battery → Sabertooth → motors</text><text x="180" y="1480" class="group">12 V</text><text x="180" y="1509" class="small">Battery → converter</text><text x="180" y="1570" class="group">5 V</text><text x="180" y="1599" class="small">Converter → Raspberry Pi 5</text><text x="180" y="1660" class="group">5 V</text><text x="180" y="1689" class="small">Pi 5 → camera</text><text x="180" y="1750" class="group">5 V</text><text x="180" y="1779" class="small">Converter → Arduino Mega</text><text x="180" y="1840" class="group">5 V</text><text x="180" y="1869" class="small">Arduino → servo shield → arm</text><text x="180" y="1930" class="group">5 V</text><text x="180" y="1959" class="small">Arduino → encoders + fans</text><text x="180" y="2045" class="small">Battery: 4000 mAh · warning: 11.4 V</text></svg>