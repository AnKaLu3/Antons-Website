<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">Two sensing systems on one robot platform</title><desc id="desc">Camera Module 3 feeds Raspberry Pi 5 running YOLOv8n; target class, confidence, image size, x/y coordinates and colour go over serial to Arduino Mega. The alternative servo-swept VL53L1X supplies distance measurements; the Arduino commands the sweep. One shared rover, Grab-it arm, gripper and collector approaches, grasps and sorts the ball, with front-wheel encoder feedback.</desc><style>svg{--ink:#071c17;--paper:#f1f8f4;--sage:#b8cbbd;--green:#285f4c;--edge:#4f9275;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:600;letter-spacing:.06em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:5 5}.link{fill:none;stroke:var(--ink);stroke-width:3}.reach{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:var(--ink);stroke-width:1.2}.joint{fill:var(--paper);stroke:var(--ink);stroke-width:2}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="1120" height="580" fill="#b8cbbd"/><text x="65" y="45" class="heading" text-anchor="start">CAMERA</text><text x="65" y="335" class="heading" text-anchor="start">TIME OF FLIGHT</text><text x="860" y="45" class="heading" text-anchor="start">SHARED PLATFORM</text><g><rect x="47.5" y="87.0" width="195" height="76" rx="2" class="component"/><circle cx="69.5" cy="125" r="11" class="illustration"/><circle cx="69.5" cy="125" r="4" class="illustration"/><text x="157" y="119" class="node-title" text-anchor="middle">Camera Module 3</text><text x="157" y="143" class="small" text-anchor="middle">v3 Wide</text></g><g><rect x="332.5" y="87.0" width="205" height="76" rx="2" class="component"/><path d="M348.5 87.0 v-7 M348.5 163.0 v7" class="pin"/><path d="M360.5 87.0 v-7 M360.5 163.0 v7" class="pin"/><path d="M509.5 87.0 v-7 M509.5 163.0 v7" class="pin"/><path d="M521.5 87.0 v-7 M521.5 163.0 v7" class="pin"/><text x="435" y="119" class="node-title" text-anchor="middle">Raspberry Pi 5</text><text x="435" y="143" class="small" text-anchor="middle">Python · YOLOv8n</text></g><g><rect x="630.0" y="220.0" width="210" height="80" rx="2" class="component"/><path d="M646.0 220.0 v-7 M646.0 300.0 v7" class="pin"/><path d="M658.0 220.0 v-7 M658.0 300.0 v7" class="pin"/><path d="M812.0 220.0 v-7 M812.0 300.0 v7" class="pin"/><path d="M824.0 220.0 v-7 M824.0 300.0 v7" class="pin"/><text x="735" y="254" class="node-title" text-anchor="middle">Arduino Mega 2560</text><text x="735" y="278" class="small" text-anchor="middle">heading + distance</text></g><g><rect x="47.5" y="367.0" width="195" height="76" rx="2" class="component"/><path d="M63.5 367.0 v-7 M63.5 443.0 v7" class="pin"/><path d="M75.5 367.0 v-7 M75.5 443.0 v7" class="pin"/><path d="M214.5 367.0 v-7 M214.5 443.0 v7" class="pin"/><path d="M226.5 367.0 v-7 M226.5 443.0 v7" class="pin"/><text x="145" y="399" class="node-title" text-anchor="middle">VL53L1X</text><text x="145" y="423" class="small" text-anchor="middle">servo-swept sensor</text></g><g transform="translate(970 278) scale(0.95)" class="illustration"><path d="M-65 15 H60 V60 H-65 Z M-30 15 V-5 L10 -65 L70 -40 L90 -10 M70 -40 L100 -55 M90 -10 L110 -20"/><circle cx="-50" cy="65" r="15"/><circle cx="45" cy="65" r="15"/><circle cx="10" cy="-65" r="5"/><circle cx="70" cy="-40" r="5"/><path d="M-75 30 H-65 M60 30 H70 M-75 45 H-65 M60 45 H70"/></g><text x="970" y="389" class="" text-anchor="middle">A4WD3 rover + Grab-it arm</text><text x="970" y="411" class="small" text-anchor="middle">Shared gripper and collector</text><path d="M242 125 H332" class="camera-flow"/><text x="287" y="108" class="small" text-anchor="middle">Image data</text><path d="M538 125 H735 V220" class="camera-flow"/><text x="685" y="89" class="small" text-anchor="middle">Target class / confidence</text><text x="685" y="111" class="small" text-anchor="middle">Image size, x, y, colour · serial</text><path d="M242 405 H735 V300" class="tof-flow"/><text x="476" y="389" class="small" text-anchor="middle">Distance measurements</text><path d="M665 300 V455 H145 V443" class="tof-flow"/><text x="434" y="478" class="small" text-anchor="middle">Servo sweep command</text><path d="M840 245 H870 V293 H898" class="signal"/><text x="970" y="120" class="small" text-anchor="middle">Drive angle + distance</text><text x="970" y="143" class="small" text-anchor="middle">Grasp command</text><path d="M915 346 H870 V285 H840" class="signal"/><text x="950" y="449" class="small" text-anchor="middle">Front-wheel encoder feedback</text><circle cx="145" cy="260" r="20" class="target"/><text x="145" y="301" class="small" text-anchor="middle">9 cm target ball</text><path d="M145 240 V164" class="optical"/><text x="74" y="206" class="small" text-anchor="middle">Image</text><path d="M145 281 V367" class="optical"/><text x="305" y="306" class="small" text-anchor="middle">Reflected light</text><path d="M1035 345 H1100 V523 H55 V260 H124" class="signal"/><text x="526" y="547" class="small" text-anchor="middle">Approach → grasp → sort</text></svg>