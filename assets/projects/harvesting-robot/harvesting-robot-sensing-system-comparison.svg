<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 485" width="1040" height="485" role="img" aria-labelledby="title desc"><title id="title">Two sensing systems on one shared platform</title><desc id="desc">Camera and alternative servo-swept ToF measurements converge on the same Arduino and centrally shared rover, arm, gripper and collector. Optical target inputs, sweep commands, encoder feedback and approach/grasp/sort relationships are retained. Camera serial target data includes class, confidence, image size, x/y coordinates and colour.</desc><style>text{fill:#071c17;font:18px system-ui,sans-serif;text-anchor:middle} .small{font-size:16px;fill:#284d3c} .group{font-size:16px;fill:#284d3c;letter-spacing:.08em} .node{fill:#c9d9cc;stroke:#527363;stroke-width:.8} .edge{fill:none;stroke:#071c17;stroke-width:1;marker-end:url(#arrow)} .sense{stroke:#285f4c} .p12{stroke:#3e574b;stroke-dasharray:5 3} .p5{stroke:#285f4c;stroke-dasharray:1 3}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs><rect width="1040" height="485" fill="#b8cbbd"/><text x="155" y="42" class="group">CAMERA</text><text x="840" y="42" class="group">TIME OF FLIGHT</text><rect class="node" x="40.0" y="72.0" width="230" height="66" rx="3"/><text x="155" y="100.0" class="">Camera Module 3</text><text x="155" y="122.0" class="small">v3 Wide</text><rect class="node" x="40.0" y="207.0" width="230" height="66" rx="3"/><text x="155" y="235.0" class="">Raspberry Pi 5</text><text x="155" y="257.0" class="small">Python · YOLOv8n</text><rect class="node" x="725.0" y="207.0" width="230" height="66" rx="3"/><text x="840" y="235.0" class="">VL53L1X</text><text x="840" y="257.0" class="small">servo-swept sensor</text><rect class="node" x="415.0" y="81.0" width="210" height="48" rx="3"/><text x="520" y="111.0" class="">9 cm target ball</text><rect class="node" x="370.0" y="207.0" width="300" height="66" rx="3"/><text x="520" y="235.0" class="">Shared A4WD3 rover</text><text x="520" y="257.0" class="small">Grab-it arm · gripper · collector</text><rect class="node" x="405.0" y="377.0" width="230" height="66" rx="3"/><text x="520" y="405.0" class="">Arduino Mega 2560</text><text x="520" y="427.0" class="small">heading + distance</text><path class="edge " d="M155 138 V207"/><text x="201" y="177" class="small">Images</text><path class="edge " d="M415 105 H270"/><text x="338" y="87" class="small">Image</text><path class="edge sense" d="M625 105 H840 V207"/><text x="761" y="88" class="small">Reflected light</text><path class="edge " d="M520 207 V129"/><text x="635" y="163" class="small">Approach / grasp / sort</text><path class="edge " d="M270 240 H315 V397 H405"/><text x="230" y="365" class="small">Target data · serial</text><path class="edge sense" d="M725 240 H690 V397 H635"/><text x="715" y="365" class="small">Range</text><path class="edge " d="M500 377 V273"/><text x="430" y="329" class="small">Drive + grasp</text><path class="edge " d="M540 273 V377"/><text x="586" y="329" class="small">Encoders</text><path class="edge sense" d="M635 427 H840 V273"/><text x="776" y="449" class="small">Sweep</text></svg>